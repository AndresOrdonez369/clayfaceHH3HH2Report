<div class="ccb gate" id="gate">
  <main class="gate-wrap">
    <form class="gate-card" id="gate-form" novalidate aria-labelledby="gate-title">
      <div class="gate-art" aria-hidden="true"><span class="art-hh3"></span><span class="art-hh2"></span></div>
      <div class="gate-body">
        <h1 class="gate-title" id="gate-title">Clayface Weekend Analytics</h1>
        <p class="gate-lede">Clayface event results for Havoc Hotel 3 and Havoc Hotel 2, Oct 16–18, 2026. Sign in to open the report.</p>
        <label class="gate-field"><span>Username</span><input name="user" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
        <label class="gate-field"><span>Password</span><input name="pass" type="password" autocomplete="current-password" required></label>
        <p class="gate-error" id="gate-error" role="alert" hidden></p>
        <button class="gate-go" type="submit">Open report</button>
      </div>
      <p class="fine">Prepared by TeraCreators. The figures stay encrypted inside this file until you sign in.</p>
    </form>
  </main>
</div>
