html, body { margin: 0; background: #EEF0F2; }
/* Card back stat line: each island is a card, the page is its back. */
.ccb {
  --stock: #EEF0F2;
  --card: #FFFFFF;
  --ink: #14213D;
  --ink-2: #44506A;
  --ink-3: #5F6B84;
  --on-ink: #FFFFFF;
  --on-ink-2: #B9C2D6;
  --rule: #D6DAE0;
  --rule-2: #E7EAEE;
  --hh3: #1D6FA3;
  --hh2: #7A3FA8;
  --gold: #F2C230;
  --void: #B5341C;
  --f-num: 'Big Shoulders Display', 'Bahnschrift', 'Arial Narrow', sans-serif;
  --f-text: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 14px;
  --gap: clamp(16px, 2.2vw, 28px);
  --ease: cubic-bezier(.16, 1, .3, 1);

  position: relative;
  background: var(--stock);
  color: var(--ink);
  font-family: var(--f-text);
  font-size: 1rem;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  accent-color: var(--gold);
}
.ccb *, .ccb *::before, .ccb *::after { box-sizing: border-box; }
.ccb ::selection { background: var(--gold); color: var(--ink); }
.ccb :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
.ccb h1, .ccb h2, .ccb h3, .ccb p, .ccb dl, .ccb dd, .ccb figure { margin: 0; }
.ccb h1, .ccb h2, .ccb h3 { text-wrap: balance; }
.ccb a { color: inherit; text-underline-offset: 3px; }
.ccb .tablebox {
  scrollbar-color: var(--rule) transparent; scrollbar-width: thin;
  /* Edge shadows appear only while more columns sit off-screen. */
  background:
    linear-gradient(to right, var(--card) 40%, rgba(255, 255, 255, 0)) left / 2rem 100% no-repeat local,
    linear-gradient(to left, var(--card) 40%, rgba(255, 255, 255, 0)) right / 2rem 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(20, 33, 61, .2), transparent) left / .75rem 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(20, 33, 61, .2), transparent) right / .75rem 100% no-repeat scroll;
}

/* Shell */
.ccb .shell { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ink); color: var(--on-ink); }
.ccb .shell-in { max-width: 80rem; margin-inline: auto; display: flex; align-items: center; gap: 2rem; padding: 0 var(--gap); min-height: 4rem; }
.ccb .title { font-family: var(--f-num); font-weight: 800; font-size: 1.625rem; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
.ccb .tabs { display: flex; gap: 1.5rem; min-width: 0; overflow-x: auto; scrollbar-width: none; align-self: stretch; }
.ccb .tabs a { display: flex; align-items: center; font-stretch: 75%; font-weight: 600; font-size: .875rem; letter-spacing: .08em; text-transform: uppercase; color: var(--on-ink-2); text-decoration: none; border-bottom: 3px solid transparent; padding-top: 3px; white-space: nowrap; transition: color .2s var(--ease), border-color .2s var(--ease); }
.ccb .tabs a:hover { color: var(--on-ink); }
.ccb .tabs a.on { color: var(--gold); border-bottom-color: var(--gold); }
.ccb .credit { margin-left: auto; font-size: .8125rem; color: var(--on-ink-2); white-space: nowrap; }

.ccb .page { max-width: 80rem; margin-inline: auto; padding: var(--gap); display: grid; grid-template-columns: minmax(0, 1fr); gap: calc(var(--gap) * 1.6); }
.ccb .lede { font-size: clamp(1.125rem, 1.6vw, 1.375rem); line-height: 1.4; max-width: 46ch; color: var(--ink); }
.ccb .lede b { font-weight: 700; }

/* Island cards */
.ccb .overview { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap); }
.ccb .islands { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 30rem), 1fr)); gap: var(--gap); }
.ccb .island { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; display: grid; grid-template-rows: auto auto 1fr auto; box-shadow: 0 1px 2px rgba(20, 33, 61, .06), 0 8px 24px -12px rgba(20, 33, 61, .18); }
.ccb .island-front { position: relative; height: clamp(10.5rem, 16vw, 13rem); background-color: var(--band); background-size: cover; background-position: center 85%; box-shadow: inset 0 10px 0 var(--band); }
.ccb .island-tag { position: absolute; left: 1rem; top: calc(10px + .75rem); display: flex; align-items: baseline; gap: .75rem; background: var(--band); color: var(--on-ink); border-radius: 8px; padding: .375rem .75rem .375rem .875rem; }
.ccb .island-tag h2 { font-family: var(--f-num); font-weight: 800; font-size: 1.75rem; line-height: 1; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
.ccb .island-tag .ver { font-size: .75rem; font-stretch: 85%; letter-spacing: .04em; color: rgba(255, 255, 255, .86); white-space: nowrap; }

.ccb .statline { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--rule); }
.ccb .statline > div { padding: .875rem 1rem 1rem; border-right: 1px solid var(--rule-2); min-width: 0; }
.ccb .statline > div:last-child { border-right: 0; }
.ccb dt { font-stretch: 75%; font-weight: 600; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.ccb .statline dd { font-family: var(--f-num); font-weight: 800; font-size: clamp(2rem, 3vw, 2.625rem); line-height: 1.05; margin-top: .25rem; }

.ccb .stamp-row { display: flex; align-items: center; gap: 1.25rem; padding: 1.25rem 1rem; }
.ccb .stamp { flex: none; font-family: var(--f-num); font-weight: 800; font-size: clamp(3.5rem, 6vw, 4.75rem); line-height: .95; background: var(--gold); color: var(--ink); border-radius: 10px; padding: .375rem 1rem .25rem; box-shadow: inset 0 0 0 2px rgba(20, 33, 61, .12); }
.ccb .stamp-note { font-size: .9375rem; line-height: 1.45; color: var(--ink-2); max-width: 34ch; }
.ccb .stamp-note b { color: var(--ink); font-weight: 700; }

.ccb .fine { display: flex; flex-wrap: wrap; align-items: center; gap: .375rem .5rem; padding: .625rem 1rem .75rem; font-size: .75rem; color: var(--ink-3); border-top: 1px dashed var(--rule); }
.ccb .cat { display: inline-flex; align-items: center; justify-content: center; min-width: 1.75rem; height: 1.25rem; padding: 0 .375rem; border-radius: 5px; background: var(--ink); color: var(--on-ink); font-family: var(--f-num); font-weight: 800; font-size: .8125rem; letter-spacing: .04em; text-decoration: none; transition: background .2s var(--ease), color .2s var(--ease), transform .2s var(--ease); }
.ccb .cat:hover, .ccb .cat.lit { background: var(--gold); color: var(--ink); }
.ccb .cat.lit { transform: translateY(-1px); }

.ccb .both { background: var(--ink); color: var(--on-ink); border-radius: var(--r); padding: 1.125rem 1.5rem; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 1rem 2.5rem; }
.ccb .both h2 { font-family: var(--f-num); font-weight: 800; font-size: 1.25rem; letter-spacing: .04em; text-transform: uppercase; }
.ccb .both dl { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1rem 1.5rem; }
.ccb .both dt { color: var(--on-ink-2); }
.ccb .both dd { font-family: var(--f-num); font-weight: 800; font-size: 2rem; line-height: 1.1; }

/* Panels: the same banded card for every section */
.ccb .panel { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; box-shadow: inset 0 10px 0 var(--ink); scroll-margin-top: 5rem; }
.ccb .panel-head { padding: calc(1.25rem + 10px) 1.25rem .5rem; display: grid; gap: .375rem; }
.ccb .panel-head h2 { font-family: var(--f-num); font-weight: 800; font-size: clamp(1.75rem, 2.4vw, 2.25rem); line-height: 1.05; letter-spacing: .01em; text-transform: uppercase; }
.ccb .panel-head p { color: var(--ink-2); max-width: 70ch; }
.ccb .panel-body { padding: .75rem 1.25rem 1.25rem; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap); }
.ccb .panel-body > * { min-width: 0; }
.ccb .panel-body.two { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; }
.ccb .panel-body h3 { font-weight: 700; font-size: 1rem; margin-bottom: .5rem; }
.ccb .note { font-size: .9375rem; line-height: 1.5; color: var(--ink-2); max-width: 60ch; }
.ccb .note b { color: var(--ink); font-weight: 700; }

.ccb .legend { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; font-size: .8125rem; color: var(--ink-2); margin-bottom: .5rem; }
.ccb .legend span { display: inline-flex; align-items: center; gap: .4rem; }
.ccb .sw { width: .75rem; height: .75rem; border-radius: 3px; background: var(--ink-3); }
.ccb .sw.h3 { background: var(--hh3); } .ccb .sw.h2 { background: var(--hh2); }
.ccb .sw.light { opacity: .35; }
.ccb .chart { position: relative; min-height: 18rem; }
.ccb .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.ccb .chart text { font-family: var(--f-text); }
.ccb .tick { fill: var(--ink-3); font-size: 12px; }
.ccb .val { fill: var(--ink); font-size: 13px; font-weight: 700; }
.ccb .daylab { fill: var(--ink); font-size: 13px; font-weight: 700; }

/* Tables */
.ccb .tablebox { overflow-x: auto; }
.ccb table { width: 100%; border-collapse: collapse; font-size: .9375rem; }
.ccb th { text-align: left; font-stretch: 75%; font-weight: 600; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding: .5rem .75rem; border-bottom: 2px solid var(--ink); white-space: nowrap; }
.ccb td { padding: .5rem .75rem; border-bottom: 1px solid var(--rule-2); white-space: nowrap; }
.ccb tbody tr:last-child td { border-bottom: 0; }
.ccb .num { text-align: right; }
.ccb td .chip { display: inline-flex; align-items: center; gap: .4rem; font-weight: 600; }
.ccb td .chip .short { display: none; }
.ccb td[data-cite] { cursor: help; }
.ccb td.hash { white-space: normal; word-break: break-all; min-width: 18ch; max-width: 24ch; font-size: .75rem; line-height: 1.35; user-select: all; }
.ccb td .chip::before { content: ""; width: .5rem; height: .5rem; border-radius: 50%; background: var(--dot, var(--ink-3)); }
.ccb tr[data-key^="HH3"] .chip, .ccb tr[data-key="HH3"] .chip, .ccb tr[data-key$=" HH3"] .chip { --dot: var(--hh3); }
.ccb tr[data-key^="HH2"] .chip, .ccb tr[data-key="HH2"] .chip, .ccb tr[data-key$=" HH2"] .chip { --dot: var(--hh2); }
.ccb tr[data-key="Both"] td { font-weight: 700; }
.ccb .partial { color: var(--ink-3); font-size: .8125rem; margin-left: .375rem; }

/* Definitions and sources */
.ccb .defs { display: grid; grid-template-columns: max-content 1fr; gap: .625rem 1.5rem; }
.ccb .defs dt { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-stretch: normal; font-size: .8125rem; letter-spacing: 0; text-transform: none; color: var(--ink); padding-top: .1rem; }
.ccb .defs dd { color: var(--ink-2); max-width: 70ch; }
.ccb .src td:first-child { width: 3.5rem; }
.ccb .src code, .ccb .hash { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: .8125rem; }
.ccb .src tr:target td { background: rgba(242, 194, 48, .18); }

.ccb .foot { max-width: 80rem; margin-inline: auto; padding: 0 var(--gap) calc(var(--gap) * 2); font-size: .8125rem; color: var(--ink-3); }

/* Citation tooltip: the signature move */
.ccb [data-cite] { cursor: help; border-radius: 4px; transition: box-shadow .2s var(--ease); }
.ccb [data-cite]:hover, .ccb [data-cite]:focus-visible { box-shadow: 0 3px 0 -1px var(--gold); outline: none; }
.ccb .tip { position: absolute; z-index: 10; pointer-events: none; max-width: 22rem; background: var(--ink); color: var(--on-ink); border-radius: 8px; padding: .5rem .75rem; font-size: .8125rem; line-height: 1.4; box-shadow: 0 10px 30px -8px rgba(20, 33, 61, .45); }
.ccb .tip b { font-family: var(--f-num); font-weight: 800; font-size: .9375rem; color: var(--gold); letter-spacing: .03em; margin-right: .375rem; }
.ccb .tip span { display: block; color: var(--on-ink-2); }

.ccb .fail { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: .5rem; font-size: .8125rem; color: var(--ink-3); }
.ccb .fail::before { content: ""; width: .375rem; height: .375rem; border-radius: 50%; background: var(--void); }

/* The one authored moment: the redemption stamps press in. */
@media (prefers-reduced-motion: no-preference) {
  .ccb .stamp.pressed { animation: ccb-press .9s var(--ease) both; }
  .ccb .island:nth-child(2) .stamp.pressed { animation-delay: .12s; }
  @keyframes ccb-press { 0% { transform: scale(1.08) rotate(-2deg); box-shadow: inset 0 0 0 2px rgba(20, 33, 61, .12), 0 14px 22px -10px rgba(20, 33, 61, .35); } 100% { transform: none; box-shadow: inset 0 0 0 2px rgba(20, 33, 61, .12), 0 0 0 0 rgba(20, 33, 61, 0); } }
}

@media (max-width: 56rem) {
  .ccb .panel-body.two { grid-template-columns: minmax(0, 1fr); }
  .ccb .both { grid-template-columns: 1fr; }
  .ccb .both dl { grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); }
  .ccb .credit { display: none; }
}
@media (max-width: 34rem) {
  .ccb .shell-in { flex-wrap: wrap; gap: 0 1rem; padding-top: .625rem; min-height: 0; }
  .ccb .title { font-size: 1.25rem; }
  .ccb .tabs { flex-basis: 100%; min-height: 2.75rem; }
  .ccb .panel { scroll-margin-top: 7rem; }
  .ccb .island-tag { flex-direction: column; align-items: flex-start; gap: .125rem; }
  .ccb td .chip .long { display: none; }
  .ccb td .chip .short { display: inline; }
  .ccb #context-table td:first-child { white-space: normal; min-width: 8.5rem; }
  .ccb th, .ccb td { padding-inline: .5rem; }
  .ccb .statline { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ccb .statline > div:nth-child(2) { border-right: 0; }
  .ccb .statline > div:nth-child(-n + 2) { border-bottom: 1px solid var(--rule-2); }
  .ccb .stamp-row { flex-direction: column; align-items: flex-start; }
  .ccb .defs { grid-template-columns: 1fr; gap: .25rem; }
  .ccb .defs dd { margin-bottom: .75rem; }
}

/* Sign-in card for the standalone file: the same banded card, opened on both islands' art. */
.ccb.gate { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: var(--gap); }
.ccb .gate-wrap { width: min(100%, 28rem); }
.ccb .gate-card { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; box-shadow: 0 1px 2px rgba(20, 33, 61, .06), 0 8px 24px -12px rgba(20, 33, 61, .18); }
.ccb .gate-art { display: grid; grid-auto-rows: 6rem; }
.ccb .gate-art span { background-size: cover; background-position: center 88%; }
.ccb .gate-art .art-hh3 { background-color: var(--hh3); box-shadow: inset 0 10px 0 var(--hh3); }
.ccb .gate-art .art-hh2 { background-color: var(--hh2); box-shadow: inset 0 10px 0 var(--hh2); }
.ccb .gate-body { padding: 1.5rem 1.5rem 1.25rem; display: grid; gap: 1rem; }
.ccb .gate-title { font-family: var(--f-num); font-weight: 800; font-size: 2rem; line-height: 1; letter-spacing: .01em; text-transform: uppercase; }
.ccb .gate-lede { color: var(--ink-2); font-size: .9375rem; margin-bottom: .25rem; }
.ccb .gate-field { display: grid; gap: .375rem; }
.ccb .gate-field span { font-stretch: 75%; font-weight: 600; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.ccb .gate-field input { font: inherit; font-size: 1rem; color: var(--ink); caret-color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: .625rem .75rem; min-height: 2.75rem; transition: border-color .2s var(--ease); }
.ccb .gate-field input:hover { border-color: var(--ink-3); }
.ccb .gate-field input:focus-visible { border-color: var(--ink); outline-offset: 1px; border-radius: 8px; }
.ccb .gate-error[hidden] { display: none; }
.ccb .gate-error { display: flex; align-items: baseline; gap: .5rem; font-size: .875rem; color: var(--ink); }
.ccb .gate-error::before { content: ""; flex: none; width: .375rem; height: .375rem; border-radius: 50%; background: var(--void); transform: translateY(-.1rem); }
.ccb .gate-go { margin-top: .25rem; min-height: 3rem; border: 0; border-radius: 8px; background: var(--gold); color: var(--ink); font-family: var(--f-num); font-weight: 800; font-size: 1.25rem; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; box-shadow: inset 0 0 0 2px rgba(20, 33, 61, .12); transition: filter .2s var(--ease), transform .2s var(--ease); }
.ccb .gate-go:hover { filter: brightness(.95); }
.ccb .gate-go:active { transform: translateY(1px); }
.ccb .gate-go:disabled { cursor: progress; filter: saturate(.6); }
/* After sign-in focus moves to the report title for screen readers; no ring on a heading. */
.ccb .title:focus { outline: none; }

  redeemRate: 'weapon_redeemed ÷ clay_goal_reached',
  fightersPerClay: 'clayface_defeated ÷ clayface_clay_collected',
  totalHours: '(dwell_rooms_5s + dwell_lobby_5s) × 5 seconds',
  hoursPerFullDay: 'dwell events × 5 s, averaged over full days',
  roomHours: 'clayface_dwell_rooms_5s × 5 seconds',
  lobbyHours: 'clayface_dwell_lobby_5s × 5 seconds',
  roomShare: 'room dwell events ÷ all dwell events',
  rowsInFile: 'Days (rows) in the analytics export',
  daysTracked: 'Days with any Clayface event',
  eventsBeforeTracking: 'Clayface events dated before the first tracked day'
};

const CALCS = [
  {
    id: 'clayface_daily',
    title: 'Clayface events by day',
    description: 'Daily Clayface totals per island from the two analytics-device files; dwell events become hours at 5 seconds each. The first tracked day is marked partial.',
    inputs: ['hh3_analytics', 'hh2_analytics'],
    fn: (hh3_analytics, hh2_analytics) => {
      const num = s => Number(String(s ?? '0').replace(/\./g, '').replace(',', '.'));
      const day = r => r.Date ?? r['﻿Date'];
      const hours = events => Math.round(events * 5 / 360) / 10;
      const out = [];
      for (const [map, rows] of [['HH3', hh3_analytics], ['HH2', hh2_analytics]]) {
        const tracked = rows
          .filter(r => num(r.clayface_defeated) + num(r.clayface_dwell_rooms_5s) + num(r.clayface_dwell_lobby_5s) > 0)
          .sort((a, b) => (day(a) < day(b) ? -1 : 1));
        tracked.forEach((r, i) => {
          const roomEvents = num(r.clayface_dwell_rooms_5s), lobbyEvents = num(r.clayface_dwell_lobby_5s);
          out.push({ key: `${map} ${day(r)}`, map, day: day(r), partial: i === 0,
            defeated: num(r.clayface_defeated), clays: num(r.clayface_clay_collected),
            reached: num(r.clayface_clay_goal_reached), redeemed: num(r.clayface_weapon_redeemed),
            roomEvents, lobbyEvents, roomHours: hours(roomEvents), lobbyHours: hours(lobbyEvents) });
        });
      }
      return out;
    }
  },
  {
    id: 'clayface_totals',
    title: 'Clayface weekend totals',
    description: 'Totals per island and for both islands, with the redemption rate, players per clay, share of time in hotel rooms and hours per full day.',
    inputs: ['clayface_daily'],
    fn: (clayface_daily) => {
      const sum = (rows, f) => rows.reduce((s, r) => s + f(r), 0);
      const hours = events => Math.round(events * 5 / 360) / 10;
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const label = d => `${months[Number(d.slice(5, 7)) - 1]} ${Number(d.slice(8, 10))}`;
      const days = clayface_daily.map(r => r.day).sort();
      const period = days.length ? `${label(days[0])} – ${label(days[days.length - 1])}, ${days[0].slice(0, 4)}` : '';
      const groups = [['HH3', clayface_daily.filter(r => r.map === 'HH3')], ['HH2', clayface_daily.filter(r => r.map === 'HH2')], ['Both', clayface_daily]];
      return groups.map(([map, rows]) => {
        const full = rows.filter(r => !r.partial);
        const room = sum(rows, r => r.roomEvents), lobby = sum(rows, r => r.lobbyEvents);
        const defeated = sum(rows, r => r.defeated), clays = sum(rows, r => r.clays);
        const reached = sum(rows, r => r.reached), redeemed = sum(rows, r => r.redeemed);
        return { map, period, defeated, clays, reached, redeemed,
          roomHours: hours(room), lobbyHours: hours(lobby), totalHours: hours(room + lobby),
          roomShare: room / (room + lobby), redeemRate: redeemed / reached,
          fightersPerClay: Math.round(defeated / clays * 10) / 10,
          hoursPerFullDay: map === 'Both' ? null : hours(sum(full, r => r.roomEvents + r.lobbyEvents) / full.length) };
      });
    }
  },
  {
    id: 'tracking_start',
    title: 'Release that added tracking',
    description: 'The release in each island\'s history whose note mentions analytics, with its version and publish time.',
    inputs: ['hh3_releases', 'hh2_releases'],
    fn: (hh3_releases, hh2_releases) => [['HH3', hh3_releases], ['HH2', hh2_releases]].map(([map, rows]) => {
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const r = rows.find(x => /anal[iy]t/i.test(x['Nota de la versión'] ?? ''));
      if (!r) return { map, version: null, published: null, label: 'not found' };
      const p = r.Publicado, offset = p.slice(19, 22).replace(/^([+-])0/, '$1');
      return { map, version: Number(r['Número de versión']), published: p,
        label: `v${r['Número de versión']} · live ${months[Number(p.slice(5, 7)) - 1]} ${Number(p.slice(8, 10))}, ${p.slice(11, 16)} UTC${offset}` };
    })
  },
  {
    id: 'verification',
    title: 'Checks on the raw exports',
    description: 'Per island: days in the analytics file, its date range, the release that added tracking, days with Clayface data and Clayface events found before that day.',
    inputs: ['hh3_analytics', 'hh2_analytics', 'clayface_daily', 'tracking_start'],
    fn: (hh3_analytics, hh2_analytics, clayface_daily, tracking_start) => {
      const num = s => Number(String(s ?? '0').replace(/\./g, '').replace(',', '.'));
      const day = r => r.Date ?? r['﻿Date'];
      const cols = ['clayface_defeated', 'clayface_clay_collected', 'clayface_clay_goal_reached', 'clayface_weapon_redeemed', 'clayface_dwell_rooms_5s', 'clayface_dwell_lobby_5s'];
      return [['HH3', hh3_analytics], ['HH2', hh2_analytics]].map(([map, rows]) => {
        const days = rows.map(day).sort();
        const tracked = clayface_daily.filter(r => r.map === map).map(r => r.day).sort();
        const before = rows.filter(r => day(r) < tracked[0]).reduce((s, r) => s + cols.reduce((t, c) => t + num(r[c]), 0), 0);
        const start = tracking_start.find(r => r.map === map);
        return { map, rowsInFile: rows.length, firstDay: days[0], lastDay: days[days.length - 1],
          trackingRelease: start ? start.label : 'not found', daysTracked: tracked.length, eventsBeforeTracking: before };
      });
    }
  }
];

function createReport(root, data) {
  const ISLANDS = ['HH3', 'HH2'];
  const NAME = { HH3: 'Havoc Hotel 3', HH2: 'Havoc Hotel 2', Both: 'Both islands' };
  const COLOR = { HH3: 'var(--hh3)', HH2: 'var(--hh2)' };
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const SVG = 'http://www.w3.org/2000/svg';
  const int = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
  const one = new Intl.NumberFormat('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const shortDay = d => `${MONTHS[Number(d.slice(5, 7)) - 1]} ${Number(d.slice(8, 10))}`;
  const FMT = { int: v => int.format(v), hours: v => one.format(v), pct: v => `${one.format(v * 100)}%`, dec: v => one.format(v), day: shortDay, text: String };
  const show = (fmt, v) => (v == null || Number.isNaN(v) ? '—' : FMT[fmt](v));
  const failed = d => ['error', 'connect', 'declined', 'missing'].includes(d.status);
  const tip = root.querySelector('.tip');

  const rowFor = (rows, where) => {
    const want = [...new URLSearchParams(where || '')];
    return rows.find(r => want.every(([k, v]) => String(r[k]) === v));
  };

  // Datasets a value rests on, narrowed to one island when the value belongs to one.
  const leaves = id => (CATALOG[id] ? [id] : (CALCS.find(c => c.id === id)?.inputs ?? []).flatMap(leaves));
  const sourcesOf = (ids, island) => [...new Set(ids.flatMap(leaves))]
    .filter(ds => !island || island === 'Both' || ds.startsWith(island.toLowerCase()));

  function fillMarks() {
    root.querySelectorAll('[data-fmt]').forEach(el => {
      const d = data(el.dataset.source);
      const row = d.status === 'ok' ? rowFor(d.data, el.dataset.where) : null;
      el.classList.toggle('dash-skeleton', d.status === 'loading');
      el.textContent = row ? show(el.dataset.fmt, row[el.dataset.field]) : '—';
      if (el.hasAttribute('data-cite')) el.tabIndex = 0;
    });
  }

  function fillTable(id, cols) {
    const table = root.querySelector(`#${id}`), body = table.tBodies[0], d = data(table.dataset.source);
    body.replaceChildren();
    if (d.status !== 'ok') return;
    const heads = [...table.tHead.rows[0].cells].map(th => th.textContent);
    for (const r of d.data) {
      const tr = body.insertRow();
      tr.dataset.key = r[table.dataset.rowKey];
      cols.forEach(([field, text, numeric], i) => {
        const td = tr.insertCell();
        if (field === 'map') {
          const chip = document.createElement('span'), long = document.createElement('span'), short = document.createElement('span');
          chip.className = 'chip';
          long.className = 'long'; long.textContent = NAME[r.map] ?? r.map;
          short.className = 'short'; short.textContent = r.map;
          chip.append(long, short);
          td.append(chip);
        } else {
          td.textContent = text(r[field], r);
        }
        if (numeric) {
          td.className = 'num';
          Object.assign(td.dataset, { cite: '', source: r.src ?? table.dataset.source, field, where: `map=${r.map}`, label: r.metric ?? heads[i] });
          td.tabIndex = 0;
        }
      });
    }
  }

  const el = (name, attrs = {}, text) => {
    const node = document.createElementNS(SVG, name);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    if (text != null) node.textContent = text;
    return node;
  };
  const niceMax = (v, target) => {
    const raw = v / target, mag = 10 ** Math.floor(Math.log10(raw)), step = [1, 2, 2.5, 5, 10].find(s => s * mag >= raw) * mag;
    const ticks = Math.ceil(v / step);
    return { step, ticks, max: step * ticks };
  };

  function prepareChart(id) {
    const box = root.querySelector(`#${id}`);
    const d = data(box.dataset.source.split(' ')[0]);
    box.querySelector('svg')?.remove();
    box.querySelector('.fail')?.remove();
    box.classList.toggle('dash-skeleton', d.status === 'loading');
    if (failed(d)) {
      const f = document.createElement('div');
      f.className = 'fail';
      f.textContent = 'Failed to load';
      box.append(f);
    }
    return { box, d, width: Math.max(320, box.clientWidth) };
  }

  function grid(svg, y, x0, x1, ticks, step, format) {
    for (let i = 0; i <= ticks; i++) {
      const v = i * step;
      svg.append(el('line', { x1: x0, x2: x1, y1: y(v), y2: y(v), stroke: i === 0 ? 'var(--ink)' : 'var(--rule-2)', 'stroke-width': i === 0 ? 1.5 : 1 }));
      svg.append(el('text', { x: x0 - 8, y: y(v) + 4, 'text-anchor': 'end', class: 'tick' }, format(v)));
    }
  }

  function drawDwell() {
    const { box, d, width: W } = prepareChart('dwell-chart');
    if (d.status !== 'ok' || !d.data.length) return;
    const rows = d.data, H = 320, m = { l: 58, r: 8, t: 26, b: 54 };
    const days = [...new Set(rows.map(r => r.day))].sort();
    const total = r => r.roomHours + r.lobbyHours;
    const { step, ticks, max } = niceMax(Math.max(...rows.map(total)) * 1.08, 5);
    const y = v => H - m.b - (v / max) * (H - m.t - m.b);
    const gw = (W - m.l - m.r) / days.length, bw = Math.min(64, gw * 0.3), gap = Math.min(10, gw * 0.05);
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, 'aria-hidden': 'true' });
    grid(svg, y, m.l, W - m.r, ticks, step, v => `${int.format(v)} h`);
    days.forEach((day, gi) => {
      const cx = m.l + gw * gi + gw / 2;
      ISLANDS.forEach((map, i) => {
        const r = rows.find(x => x.day === day && x.map === map);
        if (!r) return;
        const x = i === 0 ? cx - gap / 2 - bw : cx + gap / 2;
        const g = el('g');
        g.append(el('rect', { x, y: y(r.roomHours), width: bw, height: y(0) - y(r.roomHours), fill: COLOR[map] }));
        g.append(el('rect', { x, y: y(total(r)), width: bw, height: y(r.roomHours) - y(total(r)), fill: COLOR[map], 'fill-opacity': 0.35 }));
        g.append(el('text', { x: x + bw / 2, y: y(total(r)) - 7, 'text-anchor': 'middle', class: 'val' }, int.format(total(r))));
        g.append(el('text', { x: x + bw / 2, y: H - m.b + 17, 'text-anchor': 'middle', class: 'tick' }, map));
        const hit = el('rect', { x, y: m.t, width: bw, height: H - m.t - m.b, fill: 'transparent', tabindex: 0 });
        const [ref, file] = CATALOG[`${map.toLowerCase()}_analytics`];
        const lines = [`${NAME[map]} · ${shortDay(day)}${r.partial ? ' (partial)' : ''}`, `Rooms ${one.format(r.roomHours)} h · lobby ${one.format(r.lobbyHours)} h`, `${ref} · ${file}`];
        const enter = () => { showTip(hit, lines); light([ref]); };
        hit.addEventListener('pointerenter', enter);
        hit.addEventListener('focus', enter);
        hit.addEventListener('pointerleave', hideTip);
        hit.addEventListener('blur', hideTip);
        g.append(hit);
        svg.append(g);
      });
      svg.append(el('text', { x: cx, y: H - m.b + 40, 'text-anchor': 'middle', class: 'daylab' }, `${shortDay(day)}${rows.some(r => r.day === day && r.partial) ? ' (partial)' : ''}`));
    });
    box.prepend(svg);
  }

  function showTip(target, lines, ev) {
    const [head, ...rest] = lines;
    const b = document.createElement('b');
    b.textContent = head;
    tip.replaceChildren(b, ...rest.map(line => { const s = document.createElement('span'); s.textContent = line; return s; }));
    tip.hidden = false;
    const r = root.getBoundingClientRect(), a = target.getBoundingClientRect();
    const cx = ev ? ev.clientX : a.left + a.width / 2, top = ev ? ev.clientY - 12 : a.top;
    const left = Math.max(8, Math.min(cx - r.left - tip.offsetWidth / 2, root.clientWidth - tip.offsetWidth - 8));
    tip.style.left = `${left}px`;
    tip.style.top = `${Math.max(8, top - r.top - tip.offsetHeight - 10)}px`;
  }
  function hideTip() {
    tip.hidden = true;
    root.querySelectorAll('.cat.lit').forEach(c => c.classList.remove('lit'));
  }

  const light = refs => root.querySelectorAll('.cat[data-cat]').forEach(c => c.classList.toggle('lit', refs.includes(c.dataset.cat)));

  // The signature move: any figure names its file and lights its catalog number.
  function cite(ev) {
    const target = ev.target.closest('[data-cite]');
    if (!target || !root.contains(target)) return;
    const island = new URLSearchParams(target.dataset.where || '').get('map');
    const ds = sourcesOf(target.dataset.source.split(' '), island);
    const refs = ds.map(id => CATALOG[id][0]);
    light(refs);
    showTip(target, [refs.join(' + '), ds.map(id => CATALOG[id][1]).join(', '), FIELD_SOURCE[target.dataset.field] ?? target.dataset.label ?? target.dataset.field]);
  }
  root.addEventListener('pointerover', cite);
  root.addEventListener('focusin', cite);
  root.addEventListener('pointerout', ev => { if (ev.target.closest('[data-cite]')) hideTip(); });
  root.addEventListener('focusout', ev => { if (ev.target.closest('[data-cite]')) hideTip(); });

  // Tabs follow the reader.
  const tabs = [...root.querySelectorAll('.tabs a')];
  const sections = tabs.map(a => root.querySelector(a.getAttribute('href'))).filter(Boolean);
  if ('IntersectionObserver' in window) {
    const visible = new Set();
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => (e.isIntersecting ? visible.add(e.target) : visible.delete(e.target)));
      const current = sections.find(s => visible.has(s));
      if (current) tabs.forEach(a => a.classList.toggle('on', a.getAttribute('href') === `#${current.id}`));
    }, { rootMargin: '-30% 0px -60% 0px' });
    sections.forEach(s => io.observe(s));
  }

  let pressed = false;
  return function render() {
    fillMarks();
    fillTable('time-table', [['map'], ['roomHours', v => show('hours', v), true], ['lobbyHours', v => show('hours', v), true], ['roomShare', v => show('pct', v), true]]);
    fillTable('daily-table', [['map'], ['day', (v, r) => `${shortDay(v)}${r.partial ? ' · partial' : ''}`], ['defeated', v => show('int', v), true], ['clays', v => show('int', v), true], ['reached', v => show('int', v), true], ['redeemed', v => show('int', v), true], ['roomHours', v => show('hours', v), true], ['lobbyHours', v => show('hours', v), true]]);
    fillTable('verify-table', [['map'], ['rowsInFile', v => show('int', v), true], ['firstDay', v => shortDay(v)], ['lastDay', v => shortDay(v)], ['trackingRelease', v => v], ['daysTracked', v => show('int', v), true], ['eventsBeforeTracking', v => show('int', v), true]]);
    drawDwell();
    if (!pressed && data('clayface_totals').status === 'ok') {
      pressed = true;
      root.querySelectorAll('.stamp').forEach(s => s.classList.add('pressed'));
    }
  };
}

// Standalone bootstrap: the report markup and CSVs ship encrypted (PBKDF2-SHA256 -> AES-256-CBC + HMAC-SHA256,
// encrypt-then-MAC). The sign-in derives the keys, verifies the MAC, decrypts, then renders as usual.
(() => {
  const parse = text => {
    const rows = []; let row = [], cell = '', quoted = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (quoted) {
        if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (ch === '"') quoted = false;
        else cell += ch;
      } else if (ch === '"') quoted = true;
      else if (ch === ',') { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); cell = '';
        if (row.some(c => c !== '')) rows.push(row);
        row = [];
      } else cell += ch;
    }
    row.push(cell);
    if (row.some(c => c !== '')) rows.push(row);
    const [head, ...body] = rows;
    return body.map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ''])));
  };

  const vault = document.getElementById('vault');
  const form = document.getElementById('gate-form'), error = document.getElementById('gate-error'), go = form.querySelector('.gate-go');
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const say = text => { error.textContent = text; error.hidden = !text; };

  async function unlock(user, pass) {
    const subtle = crypto.subtle, v = vault.dataset;
    const base = await subtle.importKey('raw', new TextEncoder().encode(`${user.trim().toLowerCase()}\n${pass}`), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(v.salt), iterations: Number(v.iter) }, base, 512));
    const iv = b64(v.iv), ct = b64(vault.textContent.trim());
    const signed = new Uint8Array(iv.length + ct.length);
    signed.set(iv); signed.set(ct, iv.length);
    const macKey = await subtle.importKey('raw', bits.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    if (!await subtle.verify('HMAC', macKey, b64(v.mac), signed)) return null;
    const aesKey = await subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
    return JSON.parse(new TextDecoder().decode(await subtle.decrypt({ name: 'AES-CBC', iv }, aesKey, ct)));
  }

  function open(payload) {
    const gate = document.getElementById('gate');
    gate.insertAdjacentHTML('afterend', payload.markup);
    gate.remove();
    const store = {};
    for (const [id, text] of Object.entries(payload.csv)) store[id] = parse(text);
    for (const c of CALCS) store[c.id] = c.fn(...c.inputs.map(id => store[id]));
    const data = id => (id in store ? { status: 'ok', data: store[id] } : { status: 'missing', data: [] });
    const root = document.getElementById('report');
    const render = createReport(root, data);
    render();
    const title = root.querySelector('h1');
    title.tabIndex = -1;
    title.focus({ preventScroll: true });
    let w = innerWidth;
    addEventListener('resize', () => { if (innerWidth !== w) { w = innerWidth; render(); } });
  }

  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    if (!window.crypto || !crypto.subtle) { say('This browser blocks decryption here. Open the file directly from your computer, or over https.'); return; }
    const { user, pass } = form.elements;
    if (!user.value.trim() || !pass.value) { say('Enter the username and password you were given.'); return; }
    say('');
    go.disabled = true;
    go.textContent = 'Opening…';
    try {
      const payload = await unlock(user.value, pass.value);
      if (payload) return open(payload);
      say('Username or password is incorrect. Check both and try again.');
      pass.select();
    } catch {
      say('This report could not be opened. The file may be damaged; ask TeraCreators for a fresh copy.');
    }
    go.disabled = false;
    go.textContent = 'Open report';
  });
})();

</script>
